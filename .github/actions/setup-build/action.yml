name: Set up Segue build
description: >
  JDK 21, Gradle with caching, and the Android SDK platform matching the project's compileSdk.
  Run after actions/checkout.

inputs:
  cache-read-only:
    description: Restore the Gradle cache but never write it.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: "21"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        # The open-source cache implementation; the default "enhanced" provider is a commercial service.
        cache-provider: basic
        cache-read-only: ${{ inputs.cache-read-only }}

    # The runner image ships an SDK, but not necessarily the platform compileSdk needs.
    # compileSdk comes from the version catalog, so bumping it there is enough.
    - name: Install Android SDK platform
      shell: bash
      run: |
        compile_sdk="$(sed -nE 's/^compileSdk[[:space:]]*=[[:space:]]*"([0-9]+)".*/\1/p' gradle/libs.versions.toml)"
        if [[ -z "$compile_sdk" ]]; then
          echo "::error file=gradle/libs.versions.toml::Could not read compileSdk from the version catalog."
          exit 1
        fi
        platform="platforms;android-${compile_sdk}"
        if [[ -f "$ANDROID_HOME/platforms/android-${compile_sdk}/android.jar" ]]; then
          echo "Android SDK $platform is already installed."
        else
          echo "Installing Android SDK $platform"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$platform" > /dev/null
        fi
