# Builds a signed release APK and AAB for a v* tag and publishes them as a GitHub Release.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SEGUE_KEYSTORE_BASE64    The release keystore (.jks), base64-encoded: `base64 -w0 release.jks`
#   SEGUE_KEYSTORE_PASSWORD  The keystore password
#   SEGUE_KEY_ALIAS          Alias of the signing key inside the keystore
#   SEGUE_KEY_PASSWORD       Password of that key
# app/build.gradle.kts reads the last three as environment variables, plus SEGUE_KEYSTORE_FILE, which
# this workflow sets to the decoded keystore's path. Without SEGUE_KEYSTORE_FILE (e.g. local builds),
# release builds are signed with the debug key.
name: Release

on:
    push:
        tags:
            - "v*"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    release:
        name: Signed release
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        permissions:
            contents: write # create the GitHub Release and upload its assets
        steps:
            - name: Check signing secrets
              env:
                  SEGUE_KEYSTORE_BASE64: ${{ secrets.SEGUE_KEYSTORE_BASE64 }}
                  SEGUE_KEYSTORE_PASSWORD: ${{ secrets.SEGUE_KEYSTORE_PASSWORD }}
                  SEGUE_KEY_ALIAS: ${{ secrets.SEGUE_KEY_ALIAS }}
                  SEGUE_KEY_PASSWORD: ${{ secrets.SEGUE_KEY_PASSWORD }}
              run: |
                  missing=()
                  for name in SEGUE_KEYSTORE_BASE64 SEGUE_KEYSTORE_PASSWORD SEGUE_KEY_ALIAS SEGUE_KEY_PASSWORD; do
                      [[ -n "${!name}" ]] || missing+=("$name")
                  done
                  if (( ${#missing[@]} )); then
                      echo "::error title=Missing signing secrets::Add these repository secrets to sign releases: ${missing[*]}. See the comment at the top of .github/workflows/release.yml."
                      exit 1
                  fi

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: ./.github/actions/setup-build
              with:
                  cache-read-only: "true"

            - name: Decode keystore
              env:
                  SEGUE_KEYSTORE_BASE64: ${{ secrets.SEGUE_KEYSTORE_BASE64 }}
              run: |
                  keystore="$RUNNER_TEMP/release.jks"
                  base64 --decode > "$keystore" <<< "$SEGUE_KEYSTORE_BASE64"
                  echo "SEGUE_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

            - name: Build signed APK and AAB
              env:
                  SEGUE_KEYSTORE_PASSWORD: ${{ secrets.SEGUE_KEYSTORE_PASSWORD }}
                  SEGUE_KEY_ALIAS: ${{ secrets.SEGUE_KEY_ALIAS }}
                  SEGUE_KEY_PASSWORD: ${{ secrets.SEGUE_KEY_PASSWORD }}
              run: ./gradlew :app:assembleRelease :app:bundleRelease

            - name: Collect release files
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  mkdir -p dist
                  cp app/build/outputs/apk/release/app-release.apk "dist/segue-${TAG}.apk"
                  cp app/build/outputs/bundle/release/app-release.aab "dist/segue-${TAG}.aab"
                  # Fail rather than publish an APK signed with the debug key.
                  apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
                  certs="$("$apksigner" verify --print-certs "dist/segue-${TAG}.apk")"
                  echo "$certs"
                  if grep -q "CN=Android Debug" <<< "$certs"; then
                      echo "::error::The release APK is signed with the debug key."
                      exit 1
                  fi
                  (cd dist && sha256sum -- * > SHA256SUMS)

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
              run: |
                  prerelease=()
                  [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
                  gh release create "$TAG" dist/* \
                      --repo "$GITHUB_REPOSITORY" \
                      --title "Segue $TAG" \
                      --generate-notes \
                      --verify-tag \
                      "${prerelease[@]}"

            - name: Remove keystore
              if: ${{ always() }}
              run: rm -f "$RUNNER_TEMP/release.jks"
